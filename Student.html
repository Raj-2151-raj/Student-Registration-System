<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Efficient student registration system to add, edit, delete and view student records with a modern responsive UI using Tailwind CSS." />
    <meta name="keywords" content="Student Registration, Student Management, JavaScript, Tailwind CSS, Local Storage" />
    <meta name="author" content="Raj Thakur" />
    
  <title>Student Registration System</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Google font */
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Poppins', sans-serif;
    }

    /* Styling for the student records container */
    #studentsTableWrapper {
      max-height: 300px; /* Fixed size for the container */
      overflow-y: auto; /* Enable vertical scrolling for overflow */
      border: 1px solid #ccc; /* Optional: Add a border to the container */
    }

    /* Add scrollbar styling (optional) */
    #studentsTableWrapper::-webkit-scrollbar {
      width: 8px;
    }
    #studentsTableWrapper::-webkit-scrollbar-thumb {
      background-color: #00796b;
      border-radius: 4px;
    }
    #studentsTableWrapper::-webkit-scrollbar-thumb:hover {
      background-color: #004d40;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-green-100 via-blue-100 to-yellow-100 min-h-screen flex flex-col items-center">
  <!-- Header Section -->
  <header class="w-full bg-blue-700 text-white text-center py-8 shadow-md">
    <h1 class="text-4xl font-extrabold">Student Registration System</h1>
    <p class="mt-4 text-lg font-medium max-w-2xl mx-auto">
      Register students, manage their records, and view details efficiently.
    </p>
  </header>

  <!-- Registration Form Section -->
  <section id="registrationSection" class="w-11/12 max-w-4xl mt-8 bg-white p-8 rounded-lg shadow-lg">
    <h2 class="text-2xl font-bold text-blue-800 mb-6 text-center">Register New Student</h2>
    <form id="studentForm" class="grid gap-6">
      <div>
        <label for="studentId" class="block font-medium text-gray-700">Student ID</label>
        <input type="text" id="studentId" name="studentId" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter Student ID" />
        <span id="studentIdError" class="text-red-500 text-sm"></span>
      </div>
      <div>
        <label for="name" class="block font-medium text-gray-700">Name</label>
        <input type="text" id="name" name="name" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter Student Name" />
        <span id="nameError" class="text-red-500 text-sm"></span>
      </div>
      <div>
        <label for="email" class="block font-medium text-gray-700">Email</label>
        <input type="email" id="email" name="email" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter Email Address" />
        <span id="emailError" class="text-red-500 text-sm"></span>
      </div>
      <div>
        <label for="contact" class="block font-medium text-gray-700">Contact</label>
        <input type="text" id="contact" name="contact" class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter Contact Number" />
        <span id="contactError" class="text-red-500 text-sm"></span>
      </div>
      <button type="button" onclick="registerStudent()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg transition-shadow">
        Register
      </button>
    </form>
  </section>

  <!-- Registered Students Records Section -->
  <section id="recordsSection" class="w-11/12 max-w-4xl mt-8 bg-white p-8 rounded-lg shadow-lg">
    <h2 class="text-2xl font-bold text-blue-800 mb-6 text-center">Registered Students</h2>
    <p id="noRecordsMessage" class="text-center text-gray-500">No students registered yet.</p>
    <div id="studentsTableWrapper" class="hidden">
      <table class="w-full border border-collapse">
        <thead>
          <tr class="bg-blue-100 text-gray-700">
            <th class="p-3 text-left">ID</th>
            <th class="p-3 text-left">Name</th>
            <th class="p-3 text-left">Email</th>
            <th class="p-3 text-left">Contact</th>
            <th class="p-3 text-left">Actions</th>
          </tr>
        </thead>
        <tbody id="studentsTable" class="text-gray-600">
          <!-- Dynamic Rows -->
        </tbody>
      </table>
    </div>
  </section>

  <script>
    // Array to store student records, retrieved from localStorage (if any)
    var students = JSON.parse(localStorage.getItem('students')) || [];

    // Register a New Student
    function registerStudent() {
      var studentId = document.getElementById("studentId").value.trim();
      var name = document.getElementById("name").value.trim();
      var email = document.getElementById("email").value.trim();
      var contact = document.getElementById("contact").value.trim();

      var valid = true;

      // Validate Student ID
      if (!studentId || isNaN(studentId)) {
        document.getElementById("studentIdError").innerText = "Enter a valid numeric ID.";
        valid = false;
      } else {
        document.getElementById("studentIdError").innerText = "";
      }

      // Validate Name
      if (!name || !/^[A-Za-z\s]+$/.test(name)) {
        document.getElementById("nameError").innerText = "Name must contain only letters.";
        valid = false;
      } else {
        document.getElementById("nameError").innerText = "";
      }

      // Validate Email
      var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !emailRegex.test(email)) {
        document.getElementById("emailError").innerText = "Enter a valid email address.";
        valid = false;
      } else {
        document.getElementById("emailError").innerText = "";
      }

      // Validate Contact Number
      if (!contact || contact.length !== 10 || isNaN(contact)) {
        document.getElementById("contactError").innerText = "Contact must be a 10-digit number.";
        valid = false;
      } else {
        document.getElementById("contactError").innerText = "";
      }

      // If all validations pass, add the student record
      if (valid) {
        var student = { studentId: studentId, name: name, email: email, contact: contact };
        students.push(student); // Add to the students array
        localStorage.setItem("students", JSON.stringify(students)); // Save to localStorage
        clearForm(); // Clear the form fields
        displayStudents(); // Refresh the student table
      }
    }

    // Clear the Form
    function clearForm() {
      document.getElementById("studentForm").reset();
    }

    // Display Students
    function displayStudents() {
      var table = document.getElementById("studentsTable");
      var tableWrapper = document.getElementById("studentsTableWrapper");
      var noRecordsMessage = document.getElementById("noRecordsMessage");

      // Clear existing table rows
      table.innerHTML = "";

      // If no students, show "No records" message
      if (students.length === 0) {
        tableWrapper.classList.add("hidden");
        noRecordsMessage.classList.remove("hidden");
        return;
      }

      // Otherwise, hide "No records" message and display the table
      noRecordsMessage.classList.add("hidden");
      tableWrapper.classList.remove("hidden");

      // Populate the table with student records
      students.forEach(function(s, index) {
        var row = document.createElement("tr");
        row.className = "border-b"; // Add Tailwind CSS class for row border
        row.innerHTML = `
          <td class="p-3">${s.studentId}</td>
          <td class="p-3">${s.name}</td>
          <td class="p-3">${s.email}</td>
          <td class="p-3">${s.contact}</td>
          <td class="p-3">
            <button onclick="editStudent(${index})" class="text-blue-500 hover:underline mr-2">Edit</button>
            <button onclick="deleteStudent(${index})" class="text-red-500 hover:underline">Delete</button>
          </td>`;
        table.appendChild(row);
      });
    }

    // Edit Student
    function editStudent(index) {
      var student = students[index];
      document.getElementById("studentId").value = student.studentId;
      document.getElementById("name").value = student.name;
      document.getElementById("email").value = student.email;
      document.getElementById("contact").value = student.contact;
      deleteStudent(index);
    }

    // Delete Student
    function deleteStudent(index) {
      if (confirm("Are you sure you want to delete this student?")) {
        students.splice(index, 1);
        localStorage.setItem("students", JSON.stringify(students));
        displayStudents();
      }
    }

    // Initialize the student table on page load
    document.addEventListener("DOMContentLoaded", displayStudents);
  </script>
</body>
</html>
